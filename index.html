<title>Maple Progress · GMS 升级与 HEXA 进度</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f8;--card:#fff;--line:#e5e8ec;--line2:#eef0f3;
  --ink:#1b2028;--muted:#6b7280;--faint:#9aa1ac;
  --auto:#2563eb;--auto-bg:#eff6ff;--manual:#b45309;--manual-bg:#fffbeb;
  --accent:#c2561c;--accent-bg:#fff2ea;--ok:#15803d;--ok-bg:#f0fdf4;
  --bad:#b91c1c;--bad-bg:#fef2f2;
}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px 18px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
.brand b{font-size:14px;font-weight:650;letter-spacing:-.2px}
.brand small{display:block;color:var(--faint);font-size:10.5px;font-weight:400}
.navlabel{font-size:10.5px;color:var(--faint);letter-spacing:.08em;padding:14px 8px 6px}
.nav a{display:block;padding:8px 10px;border-radius:8px;color:#4b5563;text-decoration:none;font-size:13px;margin-bottom:2px;cursor:pointer}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.roster{margin-top:16px;border-top:1px solid var(--line2);padding-top:12px}
.rc{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;margin-bottom:7px;cursor:pointer;font:inherit}
.rc:hover{border-color:#cbd3dc}
.rc.on{border-color:var(--accent);background:var(--accent-bg)}
.rc b{font-size:12.5px;display:block}
.rc span{font-size:11px;color:var(--muted)}
.rc .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--auto);margin-right:5px;vertical-align:1px}
.sidefoot{font-size:10.5px;color:var(--faint);padding:14px 8px 0;line-height:1.6}
main{padding:22px 26px 46px;max-width:1260px;width:100%;min-width:0}

function dailyExp(c){

  var sn=snapSorted(c),w=state.settings.window||30;
  if(sn.length>=2){
    var cutoff=dayShift(-w),recent=sn.filter(function(x){return x.d>=cutoff;});
    if(recent.length<2)recent=sn.slice(-2);
    var total=0,days=0;
    for(var i=1;i<recent.length;i++){
      var a=recent[i-1],b=recent[i];

    return {f:f/days,e:e/days,assumed:false,n:days};

      '<div class="explab">'+lab+'</div>'+
    '</div>';
  }).join('');
  var rows=d.slice().reverse().map(function(x){

   '<div class="expchart-legend">单日最高 <b>+'+num(max,2)+' T</b> · 区间合计 <b>+'+num(total,2)+' T</b> · 深色柱为今天 · 升级当天按 0 计（本级 EXP 归零）</div>'+

function nextMilestone(c){
  var best=null;
  SLOT_DEFS.forEach(function(s){var v=lvOf(c,s.id),m=Math.floor(v/10)*10+10;if(m>30)m=30;if(v<s.max&&v>=m-4&&s.max>=m){if(!best||v>best.v)best={v:v,m:m,s:s};}});

  var cx=costFor(best.s.type,Math.min(best.m,30)),base=costFor(best.s.type,Math.max(1,Math.min(best.m-1,30)));

function emptyChar(name,job,region){
  return {id:uid(),name:name,job:job||'自定义职业',world:region||'—',level:260,expPct:0,expNeed:200,target:270,
    expMult:1.22,serverType:'Heroic',snapshots:[],stock:{frag:0,erda:0},nodes:{},names:{},ledger:[],demo:false};

function applyPayload(j){
  var n=0,h=j.history||{};
  (j.characters||[]).forEach(function(x){
    if(!x||!x.name)return;
    var key=String(x.name).toLowerCase(),ch=null;
    state.chars.forEach(function(z){if(z.name.toLowerCase()===key)ch=z;});
    if(!ch){ch=emptyChar(x.name,x.job,x.region);state.chars.push(ch);}
    var wasDemo=!!ch.demo,oldLevel=+ch.level||0;
    if(x.level)ch.level=+x.level;
    if(x.job)ch.job=x.job;
    if(x.legionLevel!=null)ch.legionLevel=x.legionLevel;
    if(x.worldID!=null)ch.worldID=x.worldID;
    if(x.avatar)ch.avatar=x.avatar;
    if(wasDemo){ch.target=Math.min(300,ch.level+5);ch.expPct=0;ch.expNeed=200;ch.expMult=1.22;ch.world=x.region?String(x.region).toUpperCase():'—';}
    /* exp-pct-auto-v1: the ranking API returns cumulative current-level EXP,
       never a percentage. Recompute it on every sync so the ring and ETA
       actually advance daily. On a level-up, scale the per-level requirement
       by expMult (an approximation the user can correct on 模板与成本). */
    if(!wasDemo&&oldLevel&&+x.level>oldLevel){
      var em=clamp(+ch.expMult||1.22,1,3),jumps=Math.min(+x.level-oldLevel,10);
      for(var q=0;q<jumps;q++)ch.expNeed=(+ch.expNeed||200)*em;
    }
    if(!wasDemo&&x.exp!=null&&+ch.expNeed>0){
      var pv=+x.exp/(+ch.expNeed)*100;if(isFinite(pv))ch.expPct=clamp(pv,0,100);
    }
    ch.demo=false;ch.lastSync=new Date().toISOString();
    var hist=h[x.name]||h[key]||[];
    if(hist.length){var byD={};(ch.snapshots||[]).forEach(function(s2){byD[s2.d]=s2;});hist.forEach(function(q){byD[q.d]={d:q.d,exp:+q.exp||0,level:+q.level||ch.level};});ch.snapshots=Object.keys(byD).sort().map(function(d){return byD[d];});}
    else{var d=x.d||today();ch.snapshots=(ch.snapshots||[]).filter(function(s2){return s2.d!==d;});ch.snapshots.push({d:d,exp:+x.exp||0,level:ch.level});}
    n++;
  });
  return n;
}

/* Bounded sync: a stalled fetch used to leave the badge on "同步中" forever.
   Each endpoint gets 8s; on total failure show a concrete diagnosis and keep
   working purely offline with the last successful local data. */
function syncTargets(){
  var out=[];
  function add(x){if(x&&out.indexOf(x)<0)out.push(x);}
  add(state.settings.syncUrl||'');
  add(state.settings.syncFallback||'');
  if(/^https?:/i.test(location.href)){
    var o=location.origin;
    if(/\.workers\.dev$|\.pages\.dev$/i.test(o))add(o+'/api/snapshot');
  }
  return out;
}
function fetchJSON(url,ms){
  if(/cdn\.jsdelivr\.net/i.test(url)){var _d=new Date();var _k=_d.getUTCFullYear()+('0'+(_d.getUTCMonth()+1)).slice(-2)+('0'+_d.getUTCDate()).slice(-2)+('0'+_d.getUTCHours()).slice(-2);url=url+(url.indexOf('?')<0?'?':'&')+'t='+_k;}
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var t=setTimeout(function(){try{if(ctl)ctl.abort();}catch(e){}},ms||8000);
  return fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){
    clearTimeout(t);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  },function(e){clearTimeout(t);throw e;});
}
function lastSyncLabel(){
  var best='';
  (state.chars||[]).forEach(function(c){if(c.lastSync&&c.lastSync>best)best=c.lastSync;});
  if(!best)return '';
  return best.slice(5,10).replace('-','/')+' '+best.slice(11,16)+' UTC';
}

}
/* freshness-v1 BEGIN */
/* Cloud crons run with nobody watching. If GitHub disables an idle schedule,
   Nexon changes its API, or the job fails, the app must say so by itself. */
function freshnessHours(j){
  var ts=j&&j.updatedAt?Date.parse(j.updatedAt):NaN;
  if(!isFinite(ts)){
    var h=(j&&j.history)||{},best='';
    Object.keys(h).forEach(function(k){(h[k]||[]).forEach(function(r){if(r&&r.d&&String(r.d)>best)best=String(r.d);});});
    if(best)ts=Date.parse(best+'T08:10:00Z');
  }
  return isFinite(ts)?Math.max(0,(Date.now()-ts)/36e5):null;
}
function stampLabel(j){
  var ts=j&&j.updatedAt?new Date(j.updatedAt):null;
  if(!ts||isNaN(ts.getTime()))return '刚刚';
  function p(n){return ('0'+n).slice(-2);}
  return p(ts.getMonth()+1)+'/'+p(ts.getDate())+' '+p(ts.getHours())+':'+p(ts.getMinutes());
}
/* freshness-v1 END */
function syncNow(manual){
  var urls=syncTargets();
  if(!urls.length){
    setSyncBadge(false,'手动记账 · 未连接后端');
    if(manual)toast('未配置同步服务；可在「设置 → 自建同步 API URL」填入地址');
    return;
  }
  setSyncBadge(false,'连接中…');
  var i=0,last='';
  function fail(){
    var isNet=/AbortError|abort|timeout|Failed to fetch|NetworkError|Load failed|HTTP 5\d\d/i.test(last);
    var prev=lastSyncLabel();
    var msg=isNet?('离线'+(prev?' · 上次 '+prev:'')):('同步失败 · '+String(last||'未知错误').slice(0,14));
    setSyncBadge(false,msg);
    syncDiag(last,isNet);
    if(manual)toast((isNet?'连接超时：':'同步失败：')+String(last||'')+' — 已保留本地数据，可继续手动录入',true);
  }
  function next(){
    if(i>=urls.length){fail();return;}
    var url=urls[i++];
    fetchJSON(url,8000).then(function(j){
      try{
        var n=applyPayload(j);save();renderAll();
        var ageH=freshnessHours(j),t=stampLabel(j);
        var tooOld=ageH!=null&&ageH>30,days=ageH==null?0:Math.floor(ageH/24);
        var bad=!!j.stale||tooOld;
        setSyncBadge(!bad,tooOld?('⚠ 数据 '+days+' 天未更新'):('自动 · '+n+' 角色 · '+t));
        syncDiag('',false);
        var st=document.getElementById('syncStatus');
        if(st)st.textContent=tooOld
          ? '⚠ 云端快照最后更新于 '+t+'，已 '+days+' 天没有新数据。自动任务可能已暂停：请打开 GitHub 仓库 maple-progress-data → Actions → Daily EXP snapshot → Run workflow 手动跑一次；或检查 Cloudflare Cron。当前显示的是旧数据，手动录入不受影响。'
          : '已连接 · 云端每日 08:05 / 08:10（北京时间）自动抓取 · 数据时间 '+t+'（本机时间）· 无需电脑常开，也无需人工同步';
        if(manual)toast(bad?'服务端数据陈旧，已保留本地数据':'同步完成：'+n+' 个角色');
      }catch(e){setSyncBadge(false,'同步异常 · '+String(e.message||e).slice(0,20));if(manual)toast('同步异常：'+e.message,true);}
    },function(e){
      last=String((e&&e.name)||(e&&e.message)||e);
      next();
    });
  }
  next();
}

    '<div class="hint">名单存于云端 D1，手机、电脑与 APK 打开任一入口都会看到同一批角色；Worker 每日 UTC 00:05 抓取官方排行榜并按日累积历史。<b>最多 8 个角色，角色名 2–20 位字母/数字/-/_，区域可自动探测 NA/EU。</b>本服务端已启用管理密钥，添加 / 移除 / 立即抓取需在下方填写。</div>'+
    '<div class="inline" style="margin:10px 0"><input type="text" id="watchName" placeholder="角色名" style="width:140px">'+
    '<select id="watchRegion" style="width:110px"><option value="auto">自动区域</option><option value="na">NA</option><option value="eu">EU</option></select>'+
    '<input type="password" id="adminTokenInput" data-set="adminToken" value="'+esc(state.settings.adminToken||'')+'" placeholder="管理密钥" style="width:150px">'+
    '<button class="btn primary" data-act="watchAdd">添加监控</button>'+
    '<button class="btn" data-act="srvRefresh">立即抓取</button>'+
    '<button class="btn" data-act="syncNow">同步到本机</button></div>'+
    '<div id="watchList"></div>';
  page.insertBefore(d,page.firstChild);
  loadWatchlist();
}
/* ---------- 交互 ---------- */
function applySnapshots(list){
  var n=0;
  (list||[]).forEach(function(x){
    if(!x||!x.name)return;
    var ch=null;state.chars.forEach(function(z){if(z.name.toLowerCase()===String(x.name).toLowerCase())ch=z;});
    if(!ch)return;
    var d=x.d||today();
    ch.snapshots=(ch.snapshots||[]).filter(function(s){return s.d!==d;});
    ch.snapshots.push({d:d,exp:+x.exp||0,level:+x.level||ch.level});
    if(x.expPct!=null)ch.expPct=clamp(+x.expPct,0,100);
    if(x.level!=null)ch.level=+x.level;
    n++;
  });
  return n;
}
function exportJson(data,name){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'),c=C();
  if(act==='page'){state.page=t.getAttribute('data-page');save();renderNav();window.scrollTo(0,0);var m=document.querySelector('main');if(m)m.scrollTop=0;return;}
  if(act==='goManual'){state.page='manual';save();renderAll();window.scrollTo(0,0);var gm=document.querySelector('main');if(gm)gm.scrollTop=0;return;}
  if(act==='jump'){
    var jp=t.getAttribute('data-page');state.page=jp;save();renderNav();
    var je=document.querySelector(t.getAttribute('data-target')||('#page-'+jp));
    if(je&&je.scrollIntoView)je.scrollIntoView({behavior:'smooth',block:'start'});
    else{window.scrollTo(0,0);var jm=document.querySelector('main');if(jm)jm.scrollTop=0;}
    return;
  }
  if(act==='manualDone'){
    var mleft=manualChecks(c).filter(function(x){return x.req&&!x.ok;}).length;
    c.manualDoneAt=new Date().toISOString();c.manualSig=manualSig(c);
    save();renderAll();
    toast(mleft?('已标记录入完成 · 仍有 '+mleft+' 项未检测到数据'):'录入完成，右上角标记已变绿');
    return;
  }
  if(act==='manualUndo'){delete c.manualDoneAt;delete c.manualSig;save();renderAll();toast('已恢复为待录入');return;}
  if(act==='char'){state.active=t.getAttribute('data-id');save();renderAll();return;}
  if(act==='win'){state.settings.window=+t.getAttribute('data-w');save();renderDash();return;}
  if(act==='nodeUp'||act==='nodeDown'){
    var sid=t.getAttribute('data-slot'),def=SLOT_DEFS.filter(function(s){return s.id===sid;})[0];if(!def)return;
    var v=lvOf(c,sid)+(act==='nodeUp'?1:-1);
    if(act==='nodeUp'&&statLock(c,def)){toast(statLock(c,def),true);return;}
    c.nodes[sid]=clamp(v,0,def.max);save();renderDash();renderHexa();return;
  }
  if(act==='addSnap'){
    var pct=clamp(+document.getElementById('snapPct').value||0,0,100),ex=+document.getElementById('snapExp').value||0;
    c.expPct=pct;c.snapshots=(c.snapshots||[]).filter(function(s){return s.d!==today();});
    c.snapshots.push({d:today(),exp:ex,level:c.level});save();renderAll();toast('已写入 '+today()+' 快照');return;
  }
  if(act==='delSnap'){var d=t.getAttribute('data-d');c.snapshots=c.snapshots.filter(function(s){return s.d!==d;});save();renderDash();return;}
  if(act==='checkin'){
    var src=state.sources.filter(function(s){return s.id===t.getAttribute('data-src');})[0];if(!src)return;
    c.stock.frag+=+src.frag;c.stock.erda+=+src.erda;
    c.ledger.push({d:today(),src:src.id,f:+src.frag,e:+src.erda});save();renderDash();renderHexa();renderLedger();toast('已记入 '+src.name);return;
  }
  if(act==='adjust'){
    var f=+document.getElementById('adjF').value||0,e=+document.getElementById('adjE').value||0;
    if(!f&&!e){toast('请输入至少一项数值',true);return;}
    c.stock.frag+=f;c.stock.erda+=e;c.ledger.push({d:today(),src:'自定义',f:f,e:e});save();renderDash();renderHexa();renderLedger();toast('已记一笔');return;
  }
  if(act==='delLedger'){
    var lg=(c.ledger||[]).slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;}),idx=+t.getAttribute('data-i'),row=lg[idx];
    if(row){c.stock.frag-=+row.f;c.stock.erda-=+row.e;c.ledger.splice(c.ledger.indexOf(row),1);}save();renderDash();renderHexa();renderLedger();return;
  }
  if(act==='clearLedger'){c.stock={frag:0,erda:0};c.ledger=[];save();renderDash();renderHexa();renderLedger();toast('已清空本角色流水');return;}
  if(act==='exportTemplate'){exportJson({job:c.job,group:groupOf(c.job),names:c.names||{}},'hexa-template-'+c.job.replace(/[^\w-]/g,'_')+'.json');return;}
  if(act==='importTemplate'){document.getElementById('importFile').dataset.mode='template';document.getElementById('importFile').click();return;}
  if(act==='resetNames'){c.names={};save();renderConfig();renderHexa();toast('已恢复官方名称');return;}
  if(act==='applyOfficialNames'){c.names=c.names||{};var applied=0;SLOT_DEFS.forEach(function(s){var n=hexaSlotName(c.job,s.id);if(n){c.names[s.id]=n;applied++;}});save();renderConfig();renderHexa();toast('已固化 '+applied+' 个官方名称，可继续逐槽编辑');return;}
  if(act==='resetCost'){state.cost=JSON.parse(JSON.stringify(DEFAULT_COST));save();renderAll();toast('成本表已恢复默认');return;}
  if(act==='newChar'){
    var name=(document.getElementById('ncName').value||'').trim();if(!name){toast('请填写角色名',true);return;}
    var nc={id:uid(),name:name,job:(document.getElementById('ncJob').value||'自定义职业').trim(),world:(document.getElementById('ncWorld').value||'—').trim(),
      level:+document.getElementById('ncLevel').value||260,expPct:0,expNeed:+document.getElementById('ncNeed').value||200,
      target:+document.getElementById('ncTarget').value||270,expMult:1.22,serverType:'Heroic',snapshots:[],stock:{frag:0,erda:0},nodes:{},names:{},ledger:[],demo:false};
    state.chars.push(nc);state.active=nc.id;state.page='dash';save();renderAll();toast('已创建 '+name);return;
  }
  if(act==='delChar'){
    if(state.chars.length<=1){toast('至少保留一个角色',true);return;}
    var id=t.getAttribute('data-id');state.chars=state.chars.filter(function(x){return x.id!==id;});
    if(state.active===id)state.active=state.chars[0].id;save();renderAll();toast('已删除角色');return;
  }
  if(act==='clearDemo'){
    state.chars.forEach(function(x){x.snapshots=[];x.ledger=[];x.nodes={};x.names={};x.stock={frag:0,erda:0};});
    save();renderAll();toast('录入记录已清空，角色身份保留');return;
  }
  if(act==='watchAdd'){
    var wn=(document.getElementById('watchName').value||'').trim(),wr=document.getElementById('watchRegion').value;
    if(!wn){toast('请填写角色名',true);return;}
    if(!apiBase()&&location.protocol==='file:'){toast('请先在「设置」填入同步 API URL',true);return;}
    var tk=document.getElementById('adminTokenInput');if(tk&&tk.value)state.settings.adminToken=tk.value.trim();
    fetch(apiBase()+'/api/watchlist',{method:'POST',headers:adminHeaders(true),body:JSON.stringify({action:'add',name:wn,region:wr})})
      .then(function(r){return r.json();}).then(function(j){
        if(j.error){toast(j.error,true);return;}
        srvStatus=j;renderWatchlist();toast('已添加 '+wn+'，正在抓取官方数据');
        return fetch(apiBase()+'/api/refresh',{headers:adminHeaders(false),cache:'no-store'}).then(function(r){return r.json();});
      }).then(function(){syncNow(false);})
      .catch(function(e){toast('添加或抓取失败：'+e.message,true);});return;
  }
  if(act==='watchDel'){
    var dn=t.getAttribute('data-name');
    fetch(apiBase()+'/api/watchlist',{method:'POST',headers:adminHeaders(true),body:JSON.stringify({action:'remove',name:dn})})
      .then(function(r){return r.json();}).then(function(j){
        if(j.error){toast(j.error,true);return;}
        srvStatus=j;renderWatchlist();toast('已移除 '+dn);
      }).catch(function(e){toast('移除失败：'+e.message,true);});return;
  }
  if(act==='srvRefresh'){
    toast('正在抓取官方排行榜…');
    fetch(apiBase()+'/api/refresh',{headers:adminHeaders(false),cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      if(j.error){toast(j.error,true);return;}
      toast('抓取完成：'+(j.characters||[]).length+' 个角色');syncNow(false);
    }).catch(function(e){toast('抓取失败：'+e.message,true);});return;
  }
  if(act==='syncNow'){syncNow(true);return;}
  if(act==='sync'){syncNow(true);return;}
  if(act==='pasteImport'){
    var raw=document.getElementById('pasteJson').value.trim();if(!raw){toast('请先粘贴 JSON',true);return;}
    try{var j=JSON.parse(raw),n2=applySnapshots(j.characters||j);if(!n2)throw new Error('没有匹配到同名角色');save();renderAll();toast('已导入 '+n2+' 条快照');}
    catch(err){toast('解析失败：'+err.message,true);}return;
  }
  if(act==='export'){exportJson(state,'maple-progress-'+today()+'.json');toast('已导出备份');return;}
  if(act==='import'){document.getElementById('importFile').dataset.mode='all';document.getElementById('importFile').click();return;}
  if(act==='reset'){state=demoState();save();renderAll();toast('已恢复初始数据');return;}
  if(act==='phone'){document.body.classList.add('phone-sim');toast('手机视图 · 390 × 844');return;}
  if(act==='exitPhone'){document.body.classList.remove('phone-sim');return;}
});
document.addEventListener('change',function(ev){
  var t=ev.target,c=C();
  if(t.id==='targetLv'){c.target=+t.value;if(c.target<=c.level)c.target=c.level+1;save();renderDash();return;}
  if(t.id==='expMult'){c.expMult=+t.value;save();renderDash();return;}
  if(t.id==='importFile'){
    var f=t.files&&t.files[0];if(!f)return;var mode=t.dataset.mode||'all',rd=new FileReader();
    rd.onload=function(){
      try{var j=JSON.parse(rd.result);
        if(mode==='all'){
          if(!j.chars||!j.chars.length)throw new Error('不是有效的完整备份');
          state=j;if(!state.settings)state.settings=demoState().settings;
if(!state.settings.syncFallback)state.settings.syncFallback='https://maple-progress.maple-progress-zhongannan.workers.dev/api/snapshot';if(!state.cost)state.cost=JSON.parse(JSON.stringify(DEFAULT_COST));
/* stat-cost-v1: migrate the incorrect Stat tier table saved by older builds */
if(state.cost.stat&&state.cost.stat[0]&&+state.cost.stat[0][2]===230){
  state.cost.stat=DEFAULT_COST.stat.map(function(x){return x.slice();});save();
}if(!state.sources)state.sources=JSON.parse(JSON.stringify(DEFAULT_SOURCES));
if(state.costVersion!==2){state.cost=JSON.parse(JSON.stringify(DEFAULT_COST));state.costVersion=2;}
          save();renderAll();toast('备份已恢复');
        }else{
          c.names=j.names||{};if(j.job)c.job=j.job;save();renderConfig();renderHexa();renderRoster();toast('模板已导入');
        }
      }catch(err){toast('导入失败：'+err.message,true);}
      t.value='';
    };rd.readAsText(f);return;
  }
  if(t.hasAttribute('data-cost')){
    var p=t.getAttribute('data-cost').split(':');var tier=state.cost[p[0]][+p[1]];
    if(tier){tier[+p[2]]=Math.max(0,+t.value||0);save();renderAll();toast('成本表已更新');}return;
  }
  if(t.hasAttribute('data-srcf')){state.sources[+t.getAttribute('data-srcf')].frag=+t.value||0;save();renderLedger();return;}
  if(t.hasAttribute('data-srce')){state.sources[+t.getAttribute('data-srce')].erda=+t.value||0;save();renderLedger();return;}
  if(t.hasAttribute('data-name')){c.names=c.names||{};c.names[t.getAttribute('data-name')]=t.value.trim()||'';save();renderHexa();return;}
  if(t.hasAttribute('data-ch')){
    var k=t.getAttribute('data-ch'),v=t.value;
    if(['level','expNeed','expPct','target','expMult'].indexOf(k)>=0)v=+v||0;
    c[k]=v;save();renderAll();return;
  }
  if(t.hasAttribute('data-set')){state.settings[t.getAttribute('data-set')]=t.value;save();if(t.getAttribute('data-set')!=='dataVersion'&&t.getAttribute('data-set')!=='syncUrl'&&t.getAttribute('data-set')!=='adminToken'){renderDash();renderLedger();}return;}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='targetLv'||t.id==='expMult'){
    var c=C();if(t.id==='targetLv'){c.target=+t.value;document.querySelector('#page-dash .ctl label b').textContent=c.target;}
    else{c.expMult=+t.value;document.querySelectorAll('#page-dash .ctl label b')[1].textContent=num(+t.value,2)+'×';}
  }
});
document.getElementById('jobList').innerHTML=JOB_NAMES.map(function(n){return '<option value="'+esc(n)+'">';}).join('');
state=load();
/* hexa-core-v1: drop stale flat Mastery names saved by older builds */
if(state.coreVersion!==1){(state.chars||[]).forEach(function(c){if(c.names){['m1','m2','m3','m4'].forEach(function(k){delete c.names[k];});}});state.coreVersion=1;save();}
if(!state.settings)state.settings=demoState().settings;
if(!state.cost)state.cost=JSON.parse(JSON.stringify(DEFAULT_COST));
/* cost-v2: replace the old 4-tier estimate saved by previous builds */
if(state.costVersion!==2){state.cost=JSON.parse(JSON.stringify(DEFAULT_COST));state.costVersion=2;save();}
if(!state.sources)state.sources=JSON.parse(JSON.stringify(DEFAULT_SOURCES));
if(!state.page)state.page='dash';
if(location.protocol==='file:'&&/^\//.test(state.settings.syncUrl||''))state.settings.syncUrl='';
if(new URLSearchParams(location.search).get('view')==='phone')document.body.classList.add('phone-sim');
renderAll();
syncNow(false);
})();
